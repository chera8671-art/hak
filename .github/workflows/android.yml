name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Fix Structure and Sync Paths
      run: |
        # التأكد من تنظيف أي ملفات إعدادات قديمة خارج مجلد برنامج لضمان عدم التضارب
        rm -f settings.gradle build.gradle gradle.properties
        
        # الانتقال إلى المجلد الفعلي للمشروع
        cd برنامج
        
        # إعادة إنشاء المجلدات الأساسية للتأكد من سلامة الهيكل
        mkdir -p src/main/java/com/example/hak
        mkdir -p src/main/res/layout
        mkdir -p src/main/res/values
        mkdir -p gradle/wrapper

    - name: Write Android Config Files
      run: |
        cd برنامج
        
        cat << 'EOF' > settings.gradle
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
                google()
                mavenCentral()
            }
        }
        rootProject.name = "hak"
        include ':app'
        EOF

        cat << 'EOF' > build.gradle
        plugins {
            id 'com.android.application' version '8.1.1' apply false
            id 'com.android.library' version '8.1.1' apply false
            id 'org.jetbrains.kotlin.android' version '1.8.10' apply false
        }
        EOF

        # إنشاء مجلد app لتفادي أخطاء الاندماج
        mkdir -p app
        
        cat << 'EOF' > app/build.gradle
        plugins {
            id 'com.android.application'
            id 'org.jetbrains.kotlin.android'
        }
        android {
            namespace 'com.example.hak'
            compileSdk 34
            defaultConfig {
                applicationId "com.example.hak"
                minSdk 26
                targetSdk 34
                versionCode 1
                versionName "1.0"
            }
            buildTypes {
                release {
                    minifyEnabled false
                }
            }
            compileOptions {
                sourceCompatibility JavaVersion.VERSION_17
                targetCompatibility JavaVersion.VERSION_17
            }
            kotlinOptions {
                jvmTarget = '17'
            }
        }
        dependencies {
            implementation 'androidx.core:core-ktx:1.12.0'
            implementation 'androidx.appcompat:appcompat:1.6.1'
            implementation 'com.google.android.material:material:1.11.0'
            implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
        }
        EOF

        cat << 'EOF' > gradle/wrapper/gradle-wrapper.properties
        distributionBase=GRADLE_USER_HOME
        distributionPath=wrapper/dists
        distributionUrl=https\://services.gradle.org/distributions/gradle-8.1.1-bin.zip
        zipStoreBase=GRADLE_USER_HOME
        zipStorePath=wrapper/dists
        EOF

        # نقل ملفات الأكواد البرمجية إلى مكانها الصحيح داخل مجلد app الجديد
        mv src app/src

    - name: Generate Gradle Wrapper Script
      run: |
        cd برنامج
        # إنشاء ملف تدشين لـ gradle محلي يتوافق مع بيئة لينكس تلقائياً لتجنب مشاكل الصلاحيات
        gradle wrapper --gradle-version 8.1.1
        chmod +x gradlew

    - name: Build Android App (APK)
      run: |
        cd برنامج
        ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: billiard-lines-apk
        path: برنامج/app/build/outputs/apk/debug/app-debug.apk
