name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Setup Gradle Environment
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: 8.1.1

    - name: Fix Configurations & Build from Program Folder
      run: |
        # الدخول إلى المجلد الذي يحتوي على المشروع بناءً على صور المستودع لديك
        cd "برنامج"
        
        # إعادة كتابة settings.gradle لضمان التوافق المطلق وتجنب تعارض الخوادم
        cat << 'EOF' > settings.gradle
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
                google()
                mavenCentral()
            }
        }
        rootProject.name = "hak"
        EOF

        # إعادة كتابة build.gradle الرئيسي للتخلص من تعارض allprojects
        cat << 'EOF' > build.gradle
        buildscript {
            repositories {
                google()
                mavenCentral()
            }
            dependencies {
                classpath 'com.android.tools.build:gradle:8.1.1'
                classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.8.10'
            }
        }
        EOF

        # بناء التطبيق مباشرة باستخدام أداة Gradle المضافة للبيئة
        gradle assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: billiard-lines-apk
        path: برنامج/build/outputs/apk/debug/برنامج-debug.apk
        # إذا كان الاسم الافتراضي للتجميع داخل المجلد هو app، سيتم رفعه تلقائياً عبر المسار المحدث
