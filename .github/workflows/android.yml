name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Setup Gradle Environment
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: 8.1.1

    - name: Auto-Detect Project Folder and Build
      run: |
        # البحث التلقائي عن المجلد الذي يحتوي على ملف src و build.gradle والدخول إليه مهما كان اسمه
        PROJECT_DIR=$(find . -maxdepth 2 -name "src" -type d -exec dirname {} \;)
        echo "Found Android project folder at: $PROJECT_DIR"
        cd "$PROJECT_DIR"
        
        # 1. إنشاء ملف settings.gradle نظيف داخل مجلد المشروع لمنع تضارب الخوادم
        cat << 'EOF' > settings.gradle
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
                google()
                mavenCentral()
            }
        }
        rootProject.name = "billiard-lines"
        EOF

        # 2. إنشاء ملف build.gradle الرئيسي النظيف
        cat << 'EOF' > build.gradle
        buildscript {
            repositories {
                google()
                mavenCentral()
            }
            dependencies {
                classpath 'com.android.tools.build:gradle:8.1.1'
                classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.8.10'
            }
        }
        EOF

        # 3. تشغيل عملية البناء مباشرة من داخل مجلد المشروع
        gradle assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: billiard-lines-apk
        path: "**/build/outputs/apk/debug/*-debug.apk"
